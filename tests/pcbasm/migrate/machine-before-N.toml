# usaremino001 の machine.toml に移行 M を当てたもの（移行 N の前の live の形）。移行 N のテスト素材

[klipper]
host = "localhost"
port = 7125

[tact]
# タクトタイム見積り専用の値（装置の動作はこれを参照しない）
setup_sec = 300.0 # 位置合わせ・高さ計測・パージ等の固定分 [sec]（実測に合わせる）

[settle]
# 装置の静定待ち（長いほどタクトが伸び、短いほど検出がぶれる）
move_sec = 0.5 # ステージ移動後、撮影・計測に入るまでの待ち [sec]
probe_sec = 0.0 # PROBE 実行後の待ち [sec]

[detection]
# 円・塗布痕の統計検出（1 観測 = sample_count 枚の平均）
sample_count = 10 # 1 観測で撮るフレーム数
minimum_sample_count = 5 # 1 観測に必要な有効検出数

[paste_dispenser]
# rotations_per_ul = 1.0 # 1μLあたりの回転数 [rev/μL]
rotations_per_ul = 15.0 # キャリブレーション値 2026/06/08 23G S3X70-E150DN
# rotations_per_ul = 31.491713 # キャリブレーション値 2026/06/05 S3X70-E150DN
# rotations_per_ul = 69.724771 # キャリブレーション値 2026/05/08 S3X70-E150DN
solder_paste_density = 3.78 # はんだペースト密度 [mg/uL] (S3X70-E150DN)
nozzle_diameter = 0.30 # ノズル内径 [mm] (23G)
auto_line_aspect_ratio = 1.618 # Auto時に線塗布へ切り替える縦横比
auto_area_short_side_factor = 4.0 # Auto時に面塗布へ切り替える短辺のノズル径倍率
initial_purge_ul = 0.3 # fill sequence前の初回パージ量 [uL]
nozzle_outer_diameter = 0.4

[paste_dispenser.toolhead]
# カメラに対するツールヘッドの相対位置 (mm)

# 設計値
# x = 0
# y = 24.08

# 実測値
# x = 1.9873
x = 0.486
y = 22.959

# タスク終了時の駐機先。WebUI の「ノズル位置の設定」で記録する。
[paste_dispenser.nozzle_cap]
x = 66.0
y = 54.0
z = -41.0

# 塗布ジョブ開始時のノズル先端クリーニング。WebUI の「ノズル位置の設定」で記録する。
# セクションごと無いとクリーニングを行わずに塗布を開始する。
[paste_dispenser.nozzle_clean]
x = 66.0
y = 54.0
z = -38.0
press_depth = 1.0
purge_ul = 0.1
stroke = 1.0
passes = 2
wipe_speed = 5.0

[paste_dispenser.defaults]
dispense_mode = "auto" # 塗布方式: auto / dot / line / area
line_direction = "unconstrained" # 線の走行方向: unconstrained / outward / inward
ul_per_mm2 = 0.2 # パッド面積あたりのペースト量 [uL/mm^2]
paste_height = 0.2 # 塗布面のZ高さ [mm]、または auto
prime_extra_delay = 0.0 # プライム後の追加遅延 [sec]
overlap = 0.2

[paste_dispenser.motion]
max_fill_speed = 2.0 # 連続塗布できる移動速度上限 [mm/sec]（実機で 1812 が連続になるまで調整）
max_dispense_rate = 0.2 # 吐出レート上限 [uL/sec]
dispense_accel = 2.0 # 吐出加速度 [uL/sec^2]
retract_amount = 0.05 # リトラクション量 [uL]
retract_rate = 0.2
retract_accel_factor = 5.0 # リトラクション加速度係数
lift_height = 1.0 # 吐出後の上昇高さ [mm]
micro_line_settle_seconds = 0.5
post_dispense_settle_seconds = 0.5

[paste_dispenser.volume_correction]
calibration_file = "s3x70-e150dn-n0.30-h0.20-2026-09-11-14-06-34.paste-volume.json"
settle_seconds = 1.0
[camera]
device_id = 0
width = 1280
height = 800
fps = 30.0
format = "YUYV"
# キャリブレーション結果は機体固有なのでテンプレートには含めない。
# WebUI の camera_calibration ジョブを実行し、Apply でこのキーごと更新する
calibration_file = "ov9281_20260826_152426.json"

[camera.crop]
width = 600
height = 600

[probe]
min_radius = 0.3            # サンプル点が銅箔境界から確保すべき最小距離 [mm]
board_edge_margin = 2.0     # サンプル点が基板外形から確保すべき最小距離 [mm]
min_samples = 6             # 最小サンプル数 (2次曲面フィットに必要)
max_samples = 21            # 最大サンプル数
lift_height = 0.5

[reference_point]
# 基準点（top left）のおおよその絶対位置 (mm)
x = 8.5
y = 5.7
# 基準点の直径 (mm)
target_diameter = 3.0

# 基盤からみた基準点の相対位置 (mm)
[reference_point.offsets] # [x, y]で記述
top_left = [2.5, -5.0]
top_right = [-2.5, -5.0]
bottom_left = [2.5, 5.0]
bottom_right = [-2.5, 5.0]

# ジョブ完了通知音の出力先。省略時は ALSA のシステム既定デバイス・音量 0.75。
# WebUI の /dev/audio で選ぶと config/machine.toml 側に書き込まれる
# [audio]
# device = "default" # aplay -L の PCM 名（例 plughw:CARD=sndrpihifiberry,DEV=0）
# volume = 0.75      # 0.0〜1.0

[audio]
device = "plughw:CARD=MAX98357A,DEV=0"
volume = 0.3

[alignment]
# pad単位の銅箔照合による位置合わせ
max_correction = 0.5         # 1回の照合で許容する最大ずれ [mm]。超過は誤マッチとして照合失敗
search_window = 1.0 # 照合の探索窓 片側幅 [mm]
canny_low = 104.0   # Cannyエッジ検出の下側閾値
canny_high = 235.0  # Cannyエッジ検出の上側閾値
blur_ksize = 1      # GaussianBlurカーネルサイズ (奇数)
region_size_px = 200
max_passes = 5
board_edge_margin = 1.0
converge_tolerance = 0.015
region_overlap = 0.2
