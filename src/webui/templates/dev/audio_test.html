{% extends "tab.html" %}
{% block title %}通知音テスト — PCB Assembly WebUI{% endblock %}

{% endblock %}
{% block scripts %}
{{ super() }}
<script src="{{ static_asset('js/audio_test.js') }}"></script>
{% endblock %}
