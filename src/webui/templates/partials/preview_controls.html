{# プレビューの overlay 切替（none / crosshair）。初期選択は preview_overlay（既定 none）。
   copper_detection のエッジ検出版は固有なので対象外。 #}
{% set selected_overlay = preview_overlay | default('none') %}
<fieldset class="preview-controls">
  <legend>オーバーレイ</legend>
  <label><input type="radio" name="overlay" value="none" {{ 'checked' if selected_overlay == 'none' }}> なし</label>
  <label><input type="radio" name="overlay" value="crosshair" {{ 'checked' if selected_overlay == 'crosshair' }}> 十字線</label>
</fieldset>
