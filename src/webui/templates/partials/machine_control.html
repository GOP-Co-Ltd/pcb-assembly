<details id="machine-control" class="machine-control">
  <summary>マシン操作</summary>
  <div class="mc-status">
    <span id="mc-position">位置: ---</span>
    <span id="mc-homed">homed: ---</span>
  </div>
  <div class="mc-group">
    <span class="mc-label">Homing</span>
    <button data-mc-home="x">X</button>
    <button data-mc-home="y">Y</button>
    <button data-mc-home="z">Z</button>
    <button data-mc-home="">全軸</button>
  </div>
  <div class="mc-group mc-jog">
    {% for axis in ["x", "y", "z"] %}
    <div class="mc-jog-row">
      <span class="mc-label">{{ axis | upper }}</span>
      {% for dist in [-10, -1, -0.1, 0.1, 1, 10] %}
      <button data-mc-jog="{{ axis }}" data-mc-dist="{{ dist }}">{{ "%+g" | format(dist) }}</button>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
  <div class="mc-group">
    <span class="mc-label">絶対移動</span>
    <input id="mc-x" type="number" step="0.1" placeholder="X">
    <input id="mc-y" type="number" step="0.1" placeholder="Y">
    <input id="mc-z" type="number" step="0.1" placeholder="Z">
    <button id="mc-move">移動</button>
  </div>
  <div class="mc-group">
    <button id="mc-relax">Relax</button>
    <button id="mc-focus-z" {% if focus_z is none %}disabled{% endif %}>
      フォーカスZへ{% if focus_z is not none %} ({{ "%.3f" | format(focus_z) }}){% endif %}
    </button>
  </div>
</details>
