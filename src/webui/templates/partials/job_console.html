<section id="job-console" class="job-console" data-job-name="{{ job_name }}"
         data-job-names="{{ (console_job_names if console_job_names is defined else (job_name,)) | join(' ') }}">
  <div class="jc-head">
    <span id="jc-status" class="jc-status" data-status="idle">待機中</span>
    <button id="jc-abort" type="button" disabled>中止</button>
  </div>
  <div class="jc-progress">
    <div class="jc-progress-track"><div id="jc-progress-bar" class="jc-progress-bar"></div></div>
    <span id="jc-progress-text" class="jc-progress-text"></span>
  </div>
  <pre id="jc-log" class="jc-log"></pre>
  <div id="jc-result" class="jc-result" hidden>
    <p id="jc-summary" class="jc-summary"></p>
    <div id="jc-artifacts" class="jc-artifacts"></div>
    <div id="jc-apply" class="jc-apply" hidden>
      <span id="jc-apply-label"></span>
      <button id="jc-apply-btn" type="button">設定に反映</button>
      <button id="jc-discard-btn" type="button">破棄</button>
    </div>
  </div>
  <dialog id="jc-prompt" class="jc-prompt">
    <form id="jc-prompt-form" method="dialog">
      <p id="jc-prompt-message"></p>
      <div id="jc-prompt-field" class="jc-prompt-field"></div>
      <menu class="jc-prompt-actions">
        <button id="jc-prompt-no" value="no" type="submit" hidden>いいえ</button>
        <button id="jc-prompt-ok" value="ok" type="submit">OK</button>
      </menu>
    </form>
  </dialog>
</section>
