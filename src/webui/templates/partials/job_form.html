<form id="job-form" class="job-form" data-job-name="{{ job_name }}" data-testid="job-form">
  {% for spec in param_specs %}
  <div class="job-param">
    <label for="param-{{ spec.name }}">
      {{ spec.label }}{% if spec.unit %} <span class="unit">[{{ spec.unit }}]</span>{% endif %}
    </label>
    {% if spec.value_type == "choice" %}
    <select id="param-{{ spec.name }}" name="{{ spec.name }}" data-param-type="choice">
      {% for choice in spec.choices %}
      <option value="{{ choice }}"{% if choice == spec.default %} selected{% endif %}>{{ choice }}</option>
      {% endfor %}
    </select>
    {% elif spec.value_type == "bool" %}
    <input type="checkbox" id="param-{{ spec.name }}" name="{{ spec.name }}"
           data-param-type="bool"{% if spec.default %} checked{% endif %}>
    {% elif spec.value_type == "str" %}
    <input type="text" id="param-{{ spec.name }}" name="{{ spec.name }}"
           data-param-type="str" value="{{ spec.default if spec.default is not none else '' }}">
    {% else %}
    <input type="number" id="param-{{ spec.name }}" name="{{ spec.name }}" step="any"
           data-param-type="{{ spec.value_type }}"
           value="{{ spec.default if spec.default is not none else '' }}">
    {% endif %}
    {% if spec.help %}<small class="job-param-help">{{ spec.help }}</small>{% endif %}
  </div>
  {% endfor %}
  <button type="submit" id="job-run" data-testid="job-run">実行</button>
</form>
