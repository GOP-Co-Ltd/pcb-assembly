# @package hydra.sweeper
_target_: hydra_plugins.pcbasm_paste_volume.PersistentOptunaSweeper
_recursive_: false
sampler:
  _target_: optuna.samplers.TPESampler
  seed: 42
direction: minimize
storage: ???
study_name: auto
n_trials: 30
n_jobs: 1
max_failure_rate: 0.0
custom_search_space: null
params:
  trainer.learning_rate: tag(log, interval(1.0e-5, 1.0e-3))
  trainer.weight_decay: tag(log, interval(1.0e-6, 1.0e-2))
  trainer.gradient_accumulation_steps: choice(1, 2, 4)
  model.group_norm_groups: choice(1, 4, 8)
