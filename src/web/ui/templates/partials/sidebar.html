<details class="feature-menu" data-testid="feature-menu" data-responsive-menu="(max-width: 760px)" open>
  <summary>機能を選択<span>{{ feature_label }}</span></summary>
  <nav class="features" aria-label="{{ tab_label }}の機能">
    {% for group, items in sidebar_groups %}
    <section class="feature-group">
      <h3>{{ group }}</h3>
      <ul>
        {% for slug, label in items %}
        <li>
          <a href="{{ base }}/{{ slug }}"
             {% if slug == active_feature %}class="active" aria-current="page"{% endif %}>
            {{ label }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </section>
    {% endfor %}
  </nav>
</details>
