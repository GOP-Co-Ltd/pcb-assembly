<fieldset id="loading-controls" class="loading-controls" data-requires-control
          data-job-name="{{ job_name }}"
          data-loading-stages="{{ loading.stages|tojson|forceescape }}">
  <legend>ローディング</legend>
  <div class="loading-control-body">
    <div class="loading-control-section">
      <span class="loading-control-section-title">体積</span>
      <div class="loading-control-group">
        <label for="lc-amount">量 <span class="unit">[uL]</span></label>
        <input type="number" id="lc-amount" step="any" min="0" value="{{ loading.amount }}">
        <button id="lc-extrude" type="button" disabled>押出</button>
        <button id="lc-suck" type="button" disabled>吸引</button>
      </div>
    </div>
    {% if loading.rotation %}
    <div class="loading-control-section loading-control-section-rotation">
      <span class="loading-control-section-title">回転</span>
      <div class="loading-control-group loading-control-fields">
        <label for="lc-rotations">回転数 <span class="unit">[rev]</span></label>
        <input type="number" id="lc-rotations" step="any" min="0"
               value="{{ loading.rotation.rotations }}">
        <label for="lc-rate">速度 <span class="unit">[rev/s]</span></label>
        <input type="number" id="lc-rate" step="any" min="0"
               value="{{ loading.rotation.rate }}">
        <label for="lc-accel">加速度 <span class="unit">[rev/s^2]</span></label>
        <input type="number" id="lc-accel" step="any" min="0"
               value="{{ loading.rotation.accel }}">
        <label for="lc-retract-rotations">引き戻し回転数 <span class="unit">[rev]</span></label>
        <input type="number" id="lc-retract-rotations" step="any" min="0"
               value="{{ loading.rotation.retract_rotations }}">
      </div>
      <div class="loading-control-group">
        <button id="lc-extrude-rotations" type="button" disabled>回転押出</button>
        <button id="lc-suck-rotations" type="button" disabled>回転吸引</button>
      </div>
    </div>
    {% endif %}
  </div>
  <div class="loading-control-actions">
    <button id="lc-finish" type="button" disabled>ローディング終了</button>
  </div>
</fieldset>
