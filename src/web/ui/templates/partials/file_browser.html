<dialog id="file-browser" class="file-browser">
  <div class="fb-head">
    <span id="fb-path" class="fb-path"></span>
    <button id="fb-upload" type="button">アップロード</button>
    <input id="fb-upload-input" type="file" accept=".kicad_pcb" hidden>
    <button id="fb-close" type="button">閉じる</button>
  </div>
  <ul id="fb-entries" class="fb-entries"></ul>
</dialog>
