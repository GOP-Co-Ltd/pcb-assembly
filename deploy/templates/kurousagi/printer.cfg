# =============================================================================
# 部品実装機 kurousagi の Klipper 設定
# BTT SKR Pico - inversed CoreXY (X/Y) + Z
# リミットスイッチホーミング (X/Y/Z)
# =============================================================================

[include mainsail.cfg]

[mcu]
# install.sh machine が /dev/serial/by-id の実デバイスに書き換える
serial: /dev/serial/by-id/<your-mcu-id>

[printer]
kinematics: inversed_corexy
max_velocity: 100
max_accel: 500
max_z_velocity: 50
max_z_accel: 250

# =============================================================================
# X軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio4
position_endstop: 0
position_min: 0
position_max: 68
homing_speed: 20
homing_retract_dist: 5

# =============================================================================
# Y軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio3
position_endstop: 0
position_min: 0
position_max: 50
homing_speed: 20
homing_retract_dist: 5

# =============================================================================
# Z軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_z]
step_pin: gpio19
dir_pin: !gpio28
enable_pin: !gpio2
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio25
position_endstop: 0
position_min: -40
position_max: 0
homing_speed: 10            # Z軸は低速推奨
homing_retract_dist: 3
homing_positive_dir: true

# TMC2209 ドライバー設定
# =============================================================================
[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.4
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.40
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.40
stealthchop_threshold: 999999

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move]
enable_force_move: True

# =============================================================================
# ホーミング順序 (Z → X → Y)
# Z=0 がトップ位置のため、先に Z を上げてから XY を動かすことでノズルの
# 引っかかりを防ぐ
# =============================================================================
[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    {% if home_all or 'Z' in params %}
        G28 Z
        G1 Z0
    {% endif %}

    {% if home_all or 'X' in params %}
        G28 X
    {% endif %}

    {% if home_all or 'Y' in params %}
        G28 Y
    {% endif %}

[gcode_macro PRESENT]
description: X,Z軸を原点に戻し、Y軸の台座を動かして基盤を差し出す。その後脱力して待機
gcode:
    {% set y_max = printer.configfile.settings.stepper_y.position_max - 10 %} # 10mm余裕を持たせる
    G90
    G1 X0 Y{y_max} Z0 F1200
    M18

# トップライトのピン
[output_pin led_light]
pin: gpio17         # FAN1
value: 1             # 起動時ON
shutdown_value: 1    # シャットダウン時もON


# =============================================================================
# ロードセル式プローブ
# =============================================================================

[load_cell_probe]
sensor_type: hx711
sclk_pin: gpio0
dout_pin: gpio1
sample_rate: 80
# counts_per_gram と reference_tare_counts は機体ごとに LOAD_CELL_CALIBRATE で求め、SAVE_CONFIG で書く
trigger_force: 50
speed: 2
lift_speed: 20
samples: 1
sample_retract_dist: 0.5
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3
z_offset: 0
