# 部品実装（Pick and Place）機 kurousagi の雛形（inversed corexy）。
# XYZ は Klipper ではなく新ファーム（pnp-motion）で動かすので [klipper] は書かない。
# ステージの値は [pnp.motion] に書く（同じディレクトリの printer.cfg から移した値）

[settle]
# 装置の静定待ち（長いほどタクトが伸び、短いほど検出がぶれる）
move_sec = 0.5 # ステージ移動後、撮影・計測に入るまでの待ち [sec]
probe_sec = 0.0 # PROBE 実行後の待ち [sec]

[detection]
# 円・塗布痕の統計検出（1 観測 = sample_count 枚の平均）
sample_count = 10 # 1 観測で撮るフレーム数
minimum_sample_count = 5 # 1 観測に必要な有効検出数

[camera]
device_id = 0
width = 1280
height = 800
fps = 30.0
format = "YUYV"
# キャリブレーション結果は機体固有なのでテンプレートには含めない。
# WebUI の camera_calibration ジョブを実行し、Apply でこのキーごと更新する
calibration_file = "calibration.json"

[camera.crop]
width = 600
height = 600

[probe]
min_radius = 0.3            # サンプル点が銅箔境界から確保すべき最小距離 [mm]
board_edge_margin = 2.0     # サンプル点が基板外形から確保すべき最小距離 [mm]
min_samples = 6             # 最小サンプル数 (2次曲面フィットに必要)
max_samples = 12            # 最大サンプル数
lift_height = 0.5

[reference_point]
# 基準点（top left）のおおよその絶対位置 (mm)
x = 12.4
y = 1.0
# 基準点の直径 (mm)
target_diameter = 3.0

# 基盤からみた基準点の相対位置 (mm)
[reference_point.offsets] # [x, y]で記述
top_left = [2.5, -5.0]
top_right = [-2.5, -5.0]
bottom_left = [2.5, 5.0]
bottom_right = [-2.5, 5.0]

# ジョブ完了通知音の出力先。省略時は ALSA のシステム既定デバイス・音量 0.75。
# WebUI の /dev/audio で選ぶと config/machine.toml 側に書き込まれる
# [audio]
# device = "default" # aplay -L の PCM 名（例 plughw:CARD=sndrpihifiberry,DEV=0）
# volume = 0.75      # 0.0〜1.0

[alignment]
# pad単位の銅箔照合による位置合わせ
max_correction = 0.5         # 1回の照合で許容する最大ずれ [mm]。超過は誤マッチとして照合失敗
search_window = 1.0 # 照合の探索窓 片側幅 [mm]
canny_low = 90.0   # Cannyエッジ検出の下側閾値
canny_high = 208.0  # Cannyエッジ検出の上側閾値
blur_ksize = 1      # GaussianBlurカーネルサイズ (奇数)
region_size_px = 200
max_passes = 5
board_edge_margin = 1.0
converge_tolerance = 0.03
region_overlap = 0.2

# この節があれば、部品実装（Pick and Place）機として使える
[pnp]

# ピンセットのサーボ（Feetech STS3032 ×2。Rotation はステップモード、Open Close は位置モード）。
# port を書くと使える。役割（rotation_id / open_close_id）と Open Close の閉じ切り・開き切りの角度は、
# WebUI の校正タブの「ピンセットのサーボ設定」ジョブでサーボを動かして判別し、Apply で書く
# （書くまでピンセットは使えない）。ジョブは閉じ切り〜開き切りをサーボ自身の角度制限にも書くので、
# ここで範囲を広げてもサーボはその外へ動かない（逆作動式のピンセットを開き過ぎて壊さないため）
# [pnp.servo]
# port = "/dev/ttyUSB0"   # FEETECH URT-2 のシリアルポート（/dev/serial/by-id/... で固定するとよい）
# baudrate = 1000000
# rotation_id = 1         # Rotation のサーボ ID（0〜253）
# open_close_id = 2       # Open Close のサーボ ID（0〜253）
# closed_angle = 180.0   # Open Close の閉じ切りの角度（サーボの絶対角 0〜360°）
# open_angle = 210.0     # Open Close の開き切りの角度（0〜360°。閉じ切りとの差は 180° 以下）
# rotation_speed = 45.0  # Rotation を回す速さ [deg/s]（マシン操作パネルの ± とコントローラの両方）

# コントローラのスティックのデッドゾーン。省略時はどちらも 0.15（0〜0.5）
# [pnp.gamepad]
# deadzone_xy = 0.15 # 左スティック（XY）。中心からの距離
# deadzone_z = 0.15  # 右スティック（Z）

# XYZ ステージを動かす新ファーム（pnp-motion）の MCU（BTT SKR Pico）。
# この表があれば Klipper を使わずに XYZ を動かす。Klipper / Moonraker が同じシリアルを開いていないこと。
# 項目の名前と意味は Klipper の printer.cfg と同じ（ピンの ! は反転、^ はプルアップ）
[pnp.motion]
serial = "/dev/serial/by-id/usb-Klipper_rp2040_<your-mcu-id>-if00" # ls /dev/serial/by-id/ で確かめる
kinematics = "inversed_corexy"
tmc_rx_pin = "gpio9" # TMC2209 の UART（printer.cfg の uart_pin）
tmc_tx_pin = "gpio8" # printer.cfg の tx_pin
idle_timeout = 300 # 励磁したまま止めておくと、ファームがこの秒数で脱力する（原点は「未」に戻る）。0 で脱力しない
led_pin = "gpio17"   # 照明の LED。起動から常に点け、緊急停止でも消さない（MCU の reset の間だけ消える）

# ステージに掛かる荷重を測るロードセルの HX711。省略すると荷重を読まない
[pnp.motion.load_cell]
sclk_pin = "gpio0"
dout_pin = "gpio1"
# gain = "A-128"              # A-128 / A-64 / B-32
# sample_rate = 80            # [SPS]。HX711 の RATE ピンに合わせて 10 か 80
# 1 g あたりの値。機体ごとに校正する（この値は kurousagi の Klipper で求めたもの）。
# WebUI の校正タブの「ロードセルの校正」ジョブで既知の重さから求め、Apply で書く
counts_per_gram = 2666.98
# sensor_orientation = "normal" # ピンセットを押すと荷重が負になるなら "inverted"
# trigger_force = 50.0        # [g]。動いている間に、これを超えたら止める（接触停止）
# release_force = 15.0        # [g]。接触して止まった後、これを下回ったら離したとみなす（trigger_force より小さく）
# free_tare_zone = 5.0        # [mm]。Z がピンセットから離す向きの端（Z=0）からここまでの範囲で止まっていれば、載せた基板などの荷重もタールに取り込む。0 で無効。ピンセットに届かない範囲にする
press_positive = false        # ステージが上がる Z− でピンセットに押し当たる（Z+ で押し当たる機体なら true）

# X 軸 - GT2 16T プーリー（16 × 2 mm = 32 mm/回転）
[pnp.motion.x]
step_pin = "gpio11"
dir_pin = "!gpio10"
enable_pin = "!gpio12"
endstop_pin = "^gpio4"
microsteps = 64
rotation_distance = 32.0
position_min = 0.0
position_max = 68.0
position_endstop = 0.0
homing_speed = 20.0
homing_retract = 5.0
max_velocity = 100.0 # [mm/s]。コントローラのスティックを倒し切ったときの速さ
max_accel = 500.0
tmc_address = 0
run_current = 0.4

# Y 軸 - GT2 16T プーリー（16 × 2 mm = 32 mm/回転）
[pnp.motion.y]
step_pin = "gpio6"
dir_pin = "!gpio5"
enable_pin = "!gpio7"
endstop_pin = "^gpio3"
microsteps = 64
rotation_distance = 32.0
position_min = 0.0
position_max = 50.0
position_endstop = 0.0
homing_speed = 20.0
homing_retract = 5.0
max_velocity = 100.0
max_accel = 500.0
tmc_address = 2
run_current = 0.4

# Z 軸 - GT2 16T プーリー（16 × 2 mm = 32 mm/回転）。動くのはステージで、ピンセットは動かない。
# Z=0 はステージの最下部（ピンセットから最も遠い）で、原点出しは Z+（ステージを下げる向き）。
# Z− でステージが上がり、ピンセットに近づく。
# ノズルが引っかからないよう、原点出しは Z を先に出してから X・Y を出す
[pnp.motion.z]
step_pin = "gpio19"
dir_pin = "!gpio28"
enable_pin = "!gpio2"
endstop_pin = "^gpio25"
microsteps = 64
rotation_distance = 32.0
position_min = -40.0
position_max = 0.0
position_endstop = 0.0
homing_positive = true
homing_speed = 10.0 # Z 軸は低速
homing_retract = 3.0
# [mm/s]。ロードセルは 80 SPS なので、接触してから止まるまでに 1〜2 サンプル（12.5〜25 ms）かかり、
# その間に v × 12.5〜25 ms 押し込む（10 mm/s で 0.13〜0.25 mm、50 mm/s で 0.6〜1.25 mm）。速いと止まるときに脱調もしうる
max_velocity = 10.0
max_accel = 250.0
tmc_address = 1
run_current = 0.4
