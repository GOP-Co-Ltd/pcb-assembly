[klipper]
host = "localhost"
port = 7125

[settle]
# 装置の静定待ち（長いほどタクトが伸び、短いほど検出がぶれる）
move_sec = 0.5 # ステージ移動後、撮影・計測に入るまでの待ち [sec]
probe_sec = 0.0 # PROBE 実行後の待ち [sec]

[detection]
# 円・塗布痕の統計検出（1 観測 = sample_count 枚の平均）
sample_count = 10 # 1 観測で撮るフレーム数
minimum_sample_count = 5 # 1 観測に必要な有効検出数

[camera]
device_id = 0
width = 1280
height = 800
fps = 30.0
format = "YUYV"
# キャリブレーション結果は機体固有なのでテンプレートには含めない。
# WebUI の camera_calibration ジョブを実行し、Apply でこのキーごと更新する
calibration_file = "calibration.json"

[camera.crop]
width = 600
height = 600

[probe]
min_radius = 0.3            # サンプル点が銅箔境界から確保すべき最小距離 [mm]
board_edge_margin = 2.0     # サンプル点が基板外形から確保すべき最小距離 [mm]
min_samples = 6             # 最小サンプル数 (2次曲面フィットに必要)
max_samples = 12            # 最大サンプル数
lift_height = 0.5

[reference_point]
# 基準点（top left）のおおよその絶対位置 (mm)
x = 12.4
y = 1.0
# 基準点の直径 (mm)
target_diameter = 3.0

# 基盤からみた基準点の相対位置 (mm)
[reference_point.offsets] # [x, y]で記述
top_left = [2.5, -5.0]
top_right = [-2.5, -5.0]
bottom_left = [2.5, 5.0]
bottom_right = [-2.5, 5.0]

# ジョブ完了通知音の出力先。省略時は ALSA のシステム既定デバイス・音量 0.75。
# WebUI の /dev/audio で選ぶと config/machine.toml 側に書き込まれる
# [audio]
# device = "default" # aplay -L の PCM 名（例 plughw:CARD=sndrpihifiberry,DEV=0）
# volume = 0.75      # 0.0〜1.0

[alignment]
# pad単位の銅箔照合による位置合わせ
max_correction = 0.5         # 1回の照合で許容する最大ずれ [mm]。超過は誤マッチとして照合失敗
search_window = 1.0 # 照合の探索窓 片側幅 [mm]
canny_low = 90.0   # Cannyエッジ検出の下側閾値
canny_high = 208.0  # Cannyエッジ検出の上側閾値
blur_ksize = 1      # GaussianBlurカーネルサイズ (奇数)
region_size_px = 200
max_passes = 5
board_edge_margin = 1.0
converge_tolerance = 0.03
region_overlap = 0.2

# この節があれば、はんだ塗布機として使える
[solder]
paste_density = 3.78 # はんだペースト密度 [mg/uL] (S3X70-E150DN)
initial_purge_ul = 0.3 # fill sequence前の初回パージ量 [uL]

[solder.dispenser]
rotations_per_ul = 16.041064 # 1μLあたりの回転数 [rev/μL]。出発値なので dispense_calibration で機体ごとに校正する
max_dispense_rate = 0.2 # 吐出レート上限 [uL/sec]
dispense_accel = 0.2 # 吐出加速度 [uL/sec^2]
retract_amount = 0.04 # リトラクション量 [uL]
retract_accel_factor = 2.0 # リトラクション加速度係数

[solder.nozzle]
diameter = 0.25 # ノズル内径 [mm] (23G)
# outer_diameter = 0.40 # ノズル外径 [mm]。微小線の端 inset に使う。未指定なら diameter

[solder.nozzle.offset]
# カメラに対するツールヘッドの相対位置 (mm)。設計値なので toolhead_offset で実測値に置き換える
x = 0.0
y = 26.46

# タスク終了時の駐機先。WebUI の「ノズル位置の設定」で記録する。
# [solder.nozzle.cap]
# x = 0.0
# y = 0.0
# z = 0.0

# ノズル先端クリーニング。位置は WebUI の「ノズル位置の設定」で記録する。
# 初回パージを塗布前後で撮って写らなかったときだけ実行する。
# セクションごと無いとこすらず、パージのやり直しだけを行う。
# [solder.nozzle.clean]
# x = 0.0           # クリーニング位置 X [mm]
# y = 0.0           # クリーニング位置 Y [mm]
# z = 0.0           # クリーニング面（シリコン表面）の Z 高さ [mm]
# press_depth = 0.5 # 面からの押し込み量 [mm]
# purge_ul = 0.2    # こすり前のパージ量 [uL]
# stroke = 2.0      # 十字往復の片振幅 [mm]
# passes = 2        # 十字往復の反復回数
# wipe_speed = 10.0 # こすり移動速度 [mm/sec]

[solder.motion]
max_fill_speed = 2.0 # 連続塗布できる移動速度上限 [mm/sec]（実機で 1812 が連続になるまで調整）
lift_height = 2.0 # 吐出後の上昇高さ [mm]

[solder.defaults]
dispense_mode = "auto" # 塗布方式: auto / dot / line / area / micro_line
ul_per_mm2 = 0.2 # パッド面積あたりのペースト量 [uL/mm^2]
paste_height = 0.2 # 塗布面のZ高さ [mm]、または auto
prime_extra_delay = 0.0 # プライム後の追加遅延 [sec]
overlap = 0.0

[solder.auto]
line_aspect_ratio = 1.618 # Auto時に線塗布へ切り替える縦横比
area_short_side_factor = 4.0 # Auto時に面塗布へ切り替える短辺のノズル径倍率
