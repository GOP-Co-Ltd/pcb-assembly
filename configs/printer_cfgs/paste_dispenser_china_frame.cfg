# =============================================================================
# はんだペーストディスペンサーマシンの設定
# SKR MINI E3 v3.0 - X/Y/Z + D (Dispenser)
# =============================================================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_50003E0006504E5238363120-if00

[printer]
kinematics: cartesian
max_velocity: 36
max_accel: 300

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 8
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 150
homing_speed: 8
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 0
diag_pin: ^PC0
driver_SGTHRS: 120

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 8
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 116
homing_speed: 8
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.58
stealthchop_threshold: 0
diag_pin: ^PC1
driver_SGTHRS: 120

# =============================================================================
# Z軸 - GT2 20T プーリー (20 × 2mm = 40mm/rev)
# =============================================================================
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 45
homing_speed: 20
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.0
stealthchop_threshold: 0
diag_pin: ^PC2
driver_SGTHRS: 50


[manual_stepper paste_dispenser]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 0.296875
velocity: 1
accel: 2

[tmc2209 manual_stepper paste_dispenser]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.6
stealthchop_threshold: 0
diag_pin: ^PC3
driver_SGTHRS: 100

[gcode_macro ACTIVATE_PASTE_DISPENSER]
description: ペースト塗布装置をD軸として有効化
gcode:
    MANUAL_STEPPER STEPPER=paste_dispenser GCODE_AXIS=
    G4 P100
    MANUAL_STEPPER STEPPER=paste_dispenser ENABLE=1 GCODE_AXIS=D

[homing_override]
axes: xyz
gcode:
    {% set home_x = 'X' in params %}
    {% set home_y = 'Y' in params %}
    {% set home_z = 'Z' in params %}
    {% set home_d = 'D' in params %}
    {% set home_all = not (home_x or home_y or home_z or home_d) %}

    # Z軸
    {% if home_z or home_all %}
        {% set original_current_z = printer.configfile.settings['tmc2209 stepper_z'].run_current %}
        SET_KINEMATIC_POSITION Z=0
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.1
        G4 P500
        G91
        G1 Z3 F600
        G1 Z-1 F300 # 引き上げで高トルク化の衝突回避
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={original_current_z}
        G4 P500
        G28 Z
    {% endif %}

    # Y軸
    {% if home_y or home_all %}
        {% set original_current_y = printer.configfile.settings['tmc2209 stepper_y'].run_current %}
        SET_KINEMATIC_POSITION Y=0
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.2
        G4 P500
        G1 Y3 F600
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={original_current_y}
        G4 P500
        G28 Y
    {% endif %}

    # X軸
    {% if home_x or home_all %}
        {% set original_current_x = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
        SET_KINEMATIC_POSITION X=0
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.2
        G4 P500
        G1 X3 F600
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={original_current_x}
        G4 P500
        G28 X
    {% endif %}

    {% if home_d or home_all%}
        ACTIVATE_PASTE_DISPENSER
    {% endif %}

    G90 # 最後に絶対座標系に戻す

[gcode_macro Z_TOUCH]
description: Z軸で物体に接触し、ホーミングする
gcode:
    {% set z_max = printer.configfile.settings.stepper_z.position_max %}
    {% set original_current = printer.configfile.settings['tmc2209 stepper_z'].run_current %}

    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.1
    G90
    G1 Z{z_max} F300
    G28 Z

[gcode_macro SUBMIT_PLATE]
description: X,Z軸を原点に戻し、Y軸の台座を動かして基盤を差し出す。その後脱力して待機
gcode:
    {% set y_max = printer.configfile.settings.stepper_y.position_max - 10 %} # 10mm余裕を持たせる
    G90
    G1 X0 Y{y_max} Z0 F1200
    M84

[gcode_macro MOVE_ROUGHLY_TOP_LEFT_HOLE]
description: 左上穴の概算位置へ移動
variable_x: 18.5
variable_y: 8.5
variable_offset_x: 5
variable_offset_y: 5
gcode:
    G90
    G1 X{printer["gcode_macro MOVE_ROUGHLY_TOP_LEFT_HOLE"].x} Y{printer["gcode_macro MOVE_ROUGHLY_TOP_LEFT_HOLE"].y} F1200


[gcode_macro SWITCH_DISPENSER]
description: 現在のカメラ位置をディスペンサの位置に切り替え。 (RETURNで戻る)
variable_x: 13.2
variable_y: 54.7
gcode:
  {% set dir = -1.0 if 'RETURN' in params else 1.0 %}
  G91
  G1 X{dir * printer["gcode_macro SWITCH_DISPENSER"].x} Y{dir * printer["gcode_macro SWITCH_DISPENSER"].y} F2000
  G4 P100

[virtual_sdcard]
path: ~/printer_data/gcodes

[force_move]
enable_force_move: True
