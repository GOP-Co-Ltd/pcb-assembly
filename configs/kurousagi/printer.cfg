# =============================================================================
# はんだペーストディスペンサーマシンの設定
# BTT SKR Pico - CoreXY (X/Y/Z) + Paste Dispenser
# リミットスイッチホーミング (X/Y/Z)
# =============================================================================

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504450593046881C-if00

[printer]
kinematics: inversed_corexy
max_velocity: 50
max_accel: 500
max_z_velocity: 25
max_z_accel: 250

# =============================================================================
# X軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio4
position_endstop: 0
position_min: 0
position_max: 60
homing_speed: 20
homing_retract_dist: 5

# =============================================================================
# Y軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio3
position_endstop: 0
position_min: 0
position_max: 60
homing_speed: 20
homing_retract_dist: 5

# =============================================================================
# Z軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio25
position_endstop: 0
position_min: -30
position_max: 0
homing_speed: 10            # Z軸は低速推奨
homing_retract_dist: 5
homing_positive_dir: true

# =============================================================================
# ペーストディスペンサー
# =============================================================================
[manual_stepper paste_dispenser]
step_pin: gpio14
dir_pin: gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 1
velocity: 1
accel: 10

# =============================================================================
# TMC2209 ドライバー設定
# =============================================================================
[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.40
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.40
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 1.0
stealthchop_threshold: 999999

[tmc2209 manual_stepper paste_dispenser]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.6

[virtual_sdcard]
path: /home/gop/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move]
enable_force_move: True

# トップライトのピン
[output_pin led_light]
pin: gpio17         # FAN1
value: 1             # 起動時ON
shutdown_value: 1    # シャットダウン時もON

# エアポンプ
[output_pin air_pump]
pin: gpio21          # HB
value: 0             # 起動時ON

# =============================================================================
# 電気接点式プローブ
# ツールとPCB表面が接触すると導通 → PA1ピンがトリガー
# =============================================================================
[probe]
pin: ^!gpio26
speed: 5
lift_speed: 20
samples: 5
sample_retract_dist: 1
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3
z_offset: 0

# プルーブ用グラウンドのサーボ
[servo probe_gnd]
pin: gpio29
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0024
