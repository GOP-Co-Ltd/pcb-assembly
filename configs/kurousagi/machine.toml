[klipper]
host = "localhost"
port = 7125

[paste_dispenser]
rotations_per_ul = 10.0 # 1μLあたりの回転数 [rev/μL]
nozzle_size = "27G" # ノズルのゲージ
dispense_rate = 0.50 # 吐出レート [uL/sec]
dispense_accel = 1.0 # 吐出加速度 [uL/sec^2]
retract_amount = 0.5 # リトラクション量 [uL]
retract_rate = 0.5 # リトラクションレート [uL/sec]
retract_accel_factor = 2.0 # リトラクション加速度係数
paste_height = 0.1 # 塗布面のZ高さ [mm]
ul_per_mm2 = 0.2 # パッド面積あたりのペースト量 [uL/mm^2]

[paste_dispenser.toolhead]
# カメラに対するツールヘッドの相対位置 (mm)

# 設計値
# x = 0
# y = 26.46

# 実測値
x = -1.770520410218026
y = 22.999463541435127

[camera]
device_id = 0
width = 1280
height = 720
fps = 30.0
format = "YUYV"
calibration_file = "ov9281_20260402_163428.json"

[camera.crop]
width = 600
height = 600

[reference_point]
# 基準点（top left）のおおよその絶対位置 (mm)
x = 18.5
y = 12.0
# 基準点の直径 (mm)
target_diameter = 3.0

# 基盤からみた基準点の相対位置 (mm)
[reference_point.offsets] # [x, y]で記述
top_left = [5.0, -5.0]
top_right = [-5.0, -5.0]
bottom_left = [5.0, 5.0]
# bottom_right = [-5.0, 5.0]
