[klipper]
host = "localhost"
port = 7125

[paste_dispenser]
# rotations_per_ul = 1.0 # 1μLあたりの回転数 [rev/μL]
rotations_per_ul = 45.783133 # キャリブレーション値 2026/06/08 23G S3X70-E150DN
# rotations_per_ul = 31.491713 # キャリブレーション値 2026/06/05 S3X70-E150DN
# rotations_per_ul = 69.724771 # キャリブレーション値 2026/05/08 S3X70-E150DN
nozzle_diameter = 0.34 # ノズル内径 [mm] (23G)
max_dispense_rate = 0.1 # 吐出レート上限 [uL/sec]
fill_speed = 0.8 # 塗布移動速度 [mm/sec]（主設定。実機で 1812 が連続になるまで調整）
dispense_accel = 0.2 # 吐出加速度 [uL/sec^2]
retract_amount = 0.1 # リトラクション量 [uL]
retract_rate = 0.1 # リトラクションレート [uL/sec]
retract_accel_factor = 2.0 # リトラクション加速度係数
paste_height = 0.05 # 塗布面のZ高さ [mm]
ul_per_mm2 = 0.10 # パッド面積あたりのペースト量 [uL/mm^2]
prime_extra_delay = 0.0 # プライム後の追加遅延 [sec]
overlap = 0.2

[paste_dispenser.toolhead]
# カメラに対するツールヘッドの相対位置 (mm)

# 設計値
# x = 0
# y = 26.46

# 実測値
x = -1.7720002429415835
y = 23.037508313709044

[paste_dispenser.pad_align]
# pad単位の銅箔照合による位置合わせ
tolerance = 0.03    # 収束許容誤差 [mm]
max_correction = 0.3         # 1回の照合で許容する最大ずれ [mm]。超過は誤マッチとして照合失敗
search_window = 1.4 # 照合の探索窓 片側幅 [mm]
roi_margin = 0.5    # pad ROIのマージン [mm]
min_roi = 1.0       # pad ROIの最小辺長 [mm]
theta_range = 2.0   # 回転探索の片側範囲 [deg]
canny_low = 100.0   # Cannyエッジ検出の下側閾値
canny_high = 200.0  # Cannyエッジ検出の上側閾値
blur_ksize = 5      # GaussianBlurカーネルサイズ (奇数)

[camera]
device_id = 0
width = 1280
height = 720
fps = 30.0
format = "YUYV"
calibration_file = "ov9281_20260604_141709.json"

[camera.crop]
width = 600
height = 600

[probe]
servo_name = "probe_gnd"
# rack and pinion: π × module × teeth = π × 0.8 × 16 ≈ 40.212
revolution_distance = 40.212 # サーボ一回転あたりの移動量 [mm]
down_distance = 2.0          # グラウンドを下げる距離 [mm]
min_radius = 0.7            # サンプル点が銅箔境界から確保すべき最小距離 [mm]
min_samples = 6             # 最小サンプル数 (2次曲面フィットに必要)
max_samples = 15            # 最大サンプル数
shift = [-0.5, 0.0]         # プローブ点のヒューリスティックなシフト量 [x, y] (mm, マシン座標系)

[reference_point]
# 基準点（top left）のおおよその絶対位置 (mm)
x = 14.0
y = 1.5
# 基準点の直径 (mm)
target_diameter = 3.0

# 基盤からみた基準点の相対位置 (mm)
[reference_point.offsets] # [x, y]で記述
top_left = [5.0, -5.0]
top_right = [-5.0, -5.0]
bottom_left = [5.0, 5.0]
# bottom_right = [-5.0, 5.0]
