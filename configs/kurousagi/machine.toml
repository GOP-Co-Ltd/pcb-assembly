[klipper]
host = "localhost"
port = 7125

[paste_dispenser]
# rotations_per_ul = 1.0 # 1μLあたりの回転数 [rev/μL]
rotations_per_ul = 10.98572 # キャリブレーション値 2026/06/08 23G S3X70-E150DN
# rotations_per_ul = 31.491713 # キャリブレーション値 2026/06/05 S3X70-E150DN
# rotations_per_ul = 69.724771 # キャリブレーション値 2026/05/08 S3X70-E150DN
solder_paste_density = 3.78 # はんだペースト密度 [mg/uL] (S3X70-E150DN)
nozzle_diameter = 0.30 # ノズル内径 [mm] (23G)
dispense_mode = "auto" # 塗布方式: auto / dot / line / area
air_pump_enabled = true # エアポンプの有効/無効
auto_line_aspect_ratio = 1.618 # Auto時に線塗布へ切り替える縦横比
auto_area_short_side_factor = 3.0 # Auto時に面塗布へ切り替える短辺のノズル径倍率
max_dispense_rate = 0.25 # 吐出レート上限 [uL/sec]
max_fill_speed = 2.0 # 連続塗布できる移動速度上限 [mm/sec]（実機で 1812 が連続になるまで調整）
dispense_accel = 0.5 # 吐出加速度 [uL/sec^2]
retract_amount = 0.04 # リトラクション量 [uL]
retract_accel_factor = 2.0 # リトラクション加速度係数
paste_height = 0.2 # 塗布面のZ高さ [mm]、または auto
ul_per_mm2 = 0.2 # パッド面積あたりのペースト量 [uL/mm^2]
prime_extra_delay = 0.0 # プライム後の追加遅延 [sec]
initial_purge_ul = 0.1 # fill sequence前の初回パージ量 [uL]
overlap = 0.0

[paste_dispenser.toolhead]
# カメラに対するツールヘッドの相対位置 (mm)

# 設計値
# x = 0
# y = 26.46

# 実測値
x = -1.1747
y = 23.0288

[paste_dispenser.pad_align]
# pad単位の銅箔照合による位置合わせ
tolerance = 0.03    # 収束許容誤差 [mm]
max_correction = 0.3         # 1回の照合で許容する最大ずれ [mm]。超過は誤マッチとして照合失敗
search_window = 1.4 # 照合の探索窓 片側幅 [mm]
roi_margin = 0.5    # pad ROIのマージン [mm]
min_roi = 1.0       # pad ROIの最小辺長 [mm]
theta_range = 2.0   # 回転探索の片側範囲 [deg]
canny_low = 55.0   # Cannyエッジ検出の下側閾値
canny_high = 169.0  # Cannyエッジ検出の上側閾値
blur_ksize = 3      # GaussianBlurカーネルサイズ (奇数)

[camera]
device_id = 0
width = 1280
height = 720
fps = 30.0
format = "YUYV"
calibration_file = "ov9281_20260701_132631.json"

[camera.crop]
width = 600
height = 600

[probe]
min_radius = 0.3            # サンプル点が銅箔境界から確保すべき最小距離 [mm]
min_samples = 6             # 最小サンプル数 (2次曲面フィットに必要)
max_samples = 12            # 最大サンプル数
lift_height = 0.5

[reference_point]
# 基準点（top left）のおおよその絶対位置 (mm)
x = 13.2
y = 3.6
# 基準点の直径 (mm)
target_diameter = 3.0

# 基盤からみた基準点の相対位置 (mm)
[reference_point.offsets] # [x, y]で記述
top_left = [5.0, -5.0]
top_right = [-5.0, -5.0]
bottom_left = [5.0, 5.0]
# bottom_right = [-5.0, 5.0]
