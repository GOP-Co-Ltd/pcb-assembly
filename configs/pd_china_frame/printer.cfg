# =============================================================================
# はんだペーストディスペンサーマシンの設定
# SKR MINI E3 v3.0 - X/Y/Z + D (Dispenser)
# =============================================================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_50003E0006504E5238363120-if00

[printer]
kinematics: cartesian
max_velocity: 36
max_accel: 300

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 8
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 150
homing_speed: 8
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 0
diag_pin: ^PC0
driver_SGTHRS: 120

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 8
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 116
homing_speed: 8
homing_retract_dist: 0
homing_positive_dir: false

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.58
stealthchop_threshold: 0
diag_pin: ^PC1
driver_SGTHRS: 120

# =============================================================================
# Z軸 - GT2 20T プーリー (20 × 2mm = 40mm/rev)
# =============================================================================
[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_min: -45
position_max: 0
homing_speed: 20
homing_retract_dist: 0
homing_positive_dir: True

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.0
stealthchop_threshold: 0
diag_pin: ^PC2
driver_SGTHRS: 50


[manual_stepper paste_dispenser]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 0.296875
velocity: 1
accel: 2

[tmc2209 manual_stepper paste_dispenser]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.6
stealthchop_threshold: 0
diag_pin: ^PC3
driver_SGTHRS: 100

[homing_override]
axes: xyz
gcode:
    {% set home_x = 'X' in params %}
    {% set home_y = 'Y' in params %}
    {% set home_z = 'Z' in params %}
    {% set home_all = not (home_x or home_y or home_z) %}

    # Z軸
    {% if home_z or home_all %}
        {% set original_current_z = printer.configfile.settings['tmc2209 stepper_z'].run_current %}
        SET_KINEMATIC_POSITION Z=0
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.1
        G4 P250
        G91
        G1 Z-3 F600
        G1 Z1 F300 # 引き上げで高トルク化の衝突回避
        SET_TMC_CURRENT STEPPER=stepper_z CURRENT={original_current_z}
        G4 P250
        G28 Z
        SET_KINEMATIC_POSITION Z=0
    {% endif %}

    # Y軸
    {% if home_y or home_all %}
        {% set original_current_y = printer.configfile.settings['tmc2209 stepper_y'].run_current %}
        SET_KINEMATIC_POSITION Y=0
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.2
        G4 P250
        G1 Y3 F600
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={original_current_y}
        G4 P250
        G28 Y
    {% endif %}

    # X軸
    {% if home_x or home_all %}
        {% set original_current_x = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
        SET_KINEMATIC_POSITION X=0
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.2
        G4 P250
        G1 X3 F600
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={original_current_x}
        G4 P250
        G28 X
    {% endif %}

    G90 # 最後に絶対座標系に戻す

[gcode_macro PROBE]
description: Z軸で物体に接触し、ホーミングする
gcode:
    {% set z_min = printer.configfile.settings.stepper_z.position_min %}
    {% set original_current = printer.configfile.settings['tmc2209 stepper_z'].run_current %}

    SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.1
    G90
    G1 Z{z_min} F300
    G28 Z

[gcode_macro PRESENT]
description: X,Z軸を原点に戻し、Y軸の台座を動かして基盤を差し出す。その後脱力して待機
gcode:
    {% set y_max = printer.configfile.settings.stepper_y.position_max - 10 %} # 10mm余裕を持たせる
    G90
    G1 X0 Y{y_max} Z0 F1200
    M18

[virtual_sdcard]
path: ~/printer_data/gcodes

[force_move]
enable_force_move: True
