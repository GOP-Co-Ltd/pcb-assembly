[klipper]
host = "localhost"
port = 7125

[probe]
a_pin = 17
b_pin = 27
rotation_pulse = 2000    # PPR (Pulses Per Rotation)
rotation_distance = 6.4  # mm/回転 (GT2 80T -> 16Tの変換)

[paste_dispenser]
syringe_size = 9.0 # シリンジの直径 [mm]
nozzle_size = "27G" # ノズルのゲージ

[camera]
device_id = 0
width = 1280
height = 720
fps = 30.0
format = "YUYV"
calibration_file = "ov9281_20260304_114344.json"

[camera.crop]
width = 600
height = 600

[toolhead]
# カメラに対するツールヘッドの相対位置 (mm)
x = -4.5
y = 48.86

[reference_point]
# 基準点（top left）のおおよその絶対位置 (mm)
x = 6.0
y = 4.0
# 基準点の直径 (mm)
target_diameter = 3.0

# 基盤からみた基準点の相対位置 (mm)
[reference_point.offsets] # [x, y]で記述
top_left = [0.0, -5.0]
top_right = [0.0, -5.0]
bottom_left = [5.0, 5.0]
# bottom_right = [-5.0, 5.0]
