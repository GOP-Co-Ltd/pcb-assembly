machine_type = "paste" # マシン種別: paste / pnp

[klipper]
host = "localhost"
port = 7125

[paste_dispenser]
rotations_per_ul = 1.0 # 1μLあたりの回転数 [rev/μL]
solder_paste_density = 3.78 # はんだペースト密度 [mg/uL] (S3X70-E150DN)
nozzle_diameter = 0.21 # ノズル内径 [mm] (27G相当)
dispense_mode = "auto" # 塗布方式: auto / dot / line / area
auto_line_aspect_ratio = 1.618 # Auto時に線塗布へ切り替える縦横比
auto_area_short_side_factor = 3.0 # Auto時に面塗布へ切り替える短辺のノズル径倍率
max_dispense_rate = 5.0 # 吐出レート上限 [uL/sec]
max_fill_speed = 200.0 # 連続塗布できる移動速度上限 [mm/sec]。高値=吐出レート上限で律速（旧挙動踏襲・未調整）
dispense_accel = 10.0 # 吐出加速度 [uL/sec^2]
retract_amount = 50.0 # リトラクション量 [uL]
retract_rate = 50.0 # リトラクションレート [uL/sec]
retract_accel_factor = 2.0 # リトラクション加速度係数
paste_height = "auto" # 塗布面のZ高さ [mm]、または auto
ul_per_mm2 = 0.2 # パッド面積あたりのペースト量 [uL/mm^2]
initial_purge_ul = 0.1 # fill sequence前の初回パージ量 [uL]

[paste_dispenser.toolhead]
# カメラに対するツールヘッドの相対位置 (mm)

# 設計値
# x = -4.5
# y = 48.86

# 実測値
x = -4.714802389293489
y = 48.953912452257924

[paste_dispenser.pad_align]
# pad単位の銅箔照合による位置合わせ
tolerance = 0.05    # 収束許容誤差 [mm]
max_correction = 1.0         # 1回の照合で許容する最大ずれ [mm]。超過は誤マッチとして照合失敗
search_window = 2.0 # 照合の探索窓 片側幅 [mm]
roi_margin = 1.0    # pad ROIのマージン [mm]
min_roi = 3.0       # pad ROIの最小辺長 [mm]
theta_range = 2.0   # 回転探索の片側範囲 [deg]
canny_low = 100.0   # Cannyエッジ検出の下側閾値
canny_high = 200.0  # Cannyエッジ検出の上側閾値
blur_ksize = 5      # GaussianBlurカーネルサイズ (奇数)

[camera]
device_id = 0
width = 1280
height = 720
fps = 30.0
format = "YUYV"
calibration_file = "ov9281_20260304_114344.json"

[camera.crop]
width = 600
height = 600

[probe]
min_radius = 1.5           # サンプル点が銅箔境界から確保すべき最小距離 [mm]

[reference_point]
corner = "top_left" # アンカーコーナー: top_left / top_right / bottom_left / bottom_right
# アンカーコーナーの基準点マーカーのおおよその絶対位置 (mm)
x = 6.0
y = 4.0
# 基準点の直径 (mm)
target_diameter = 3.0
offset = [0.0, -5.0] # 基板コーナー → マーカー のオフセット [x, y] (mm)

[board_align]
# 基板コーナーの輪郭照合による board 変換計測
# 制約: edge_length + search_window はカメラ視野の半分以下にする
tolerance = 0.05     # 各コーナーサーボの収束許容誤差 [mm]
max_correction = 2.0 # 照合ずれの上限 [mm]。超過は誤マッチとして棄却
search_window = 1.5  # 照合の探索窓 片側幅 [mm]
edge_length = 2.0    # コーナーROIの片側辺長 = 含める外形エッジ長 [mm]
theta_range = 2.0    # 回転探索の片側範囲 [deg]
canny_low = 100.0    # Cannyエッジ検出の下側閾値
canny_high = 200.0   # Cannyエッジ検出の上側閾値
blur_ksize = 5       # GaussianBlurカーネルサイズ (奇数)
