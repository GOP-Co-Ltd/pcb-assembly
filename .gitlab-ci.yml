stages:
  - validate

default:
  tags:
    - rpi-ci
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

.python-validation:
  stage: validate
  before_script:
    - export UV_CACHE_DIR="$HOME/.cache/uv"
    - uv venv --clear --system-site-packages --python /usr/bin/python3
    - uv sync --locked --all-extras
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - changes:
        paths:
          - "**/*.py"
          # テストが読む machine.toml / printer.cfg のフィクスチャ
          - "data/testing/config/**"
          - pyproject.toml
          - uv.lock
          - .gitlab-ci.yml
    - when: never

pre-commit:
  stage: validate
  timeout: 10 minutes
  before_script:
    - export UV_CACHE_DIR="$HOME/.cache/uv"
    - export PRE_COMMIT_HOME="$HOME/.cache/pre-commit"
    - uv venv --clear --python /usr/bin/python3
    - uv sync --locked --only-group dev --no-install-project
  script:
    - uv run --no-sync pre-commit run --all-files --show-diff-on-failure

pyright:
  extends: .python-validation
  timeout: 15 minutes
  script:
    - uv run --no-sync pyright

pytest:
  extends: .python-validation
  timeout: 30 minutes
  variables:
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
  script:
    - git lfs pull
    - >-
      uv run --no-sync pytest -v -m "not hardware and not e2e"
      --timeout=180 --junitxml=pytest-report.xml
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
    paths:
      - pytest-report.xml
    expire_in: 7 days
