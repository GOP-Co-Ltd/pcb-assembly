# ML 学習・開発用コンテナ。使い方は README.md を参照。
#
# uid/gid は .env（`make ml-docker-env` が生成）から渡す。既定値を書かないのは、
# host と違う uid で build して bind mount 先の所有者がずれる事故を防ぐため。
#
# git / glab の資格情報 mount は compose.credentials.yaml へ分けてある。存在しない
# path を bind mount source に書くと Docker が root 所有の空 directory を作るため、
# host に実在する source だけを生成時に選ぶ。

# project 名を固定する。`-f docker/compose.yaml` 指定では project directory が
# docker/ になり、既定の project 名が "docker" になってしまう。他プロジェクトの
# docker/compose.yaml と volume（学習環境そのもの）を共有してしまうのを防ぐ。
name: pcb-assembly-ml

services:
  ml:
    build:
      context: .
      args:
        USER_NAME: ${USER_NAME:?make ml-docker-env で docker/.env を作ってください}
        USER_UID: ${USER_UID:?make ml-docker-env で docker/.env を作ってください}
        USER_GID: ${USER_GID:?make ml-docker-env で docker/.env を作ってください}
    image: pcb-assembly-ml:latest

    # NVIDIA Container Toolkit 経由で全 GPU を渡す（Compose v2.30 以降）
    gpus: all

    # DataLoader の worker が共有メモリを使う。既定の 64MB では足りない
    shm_size: 8gb

    # 常駐させて exec で使う。run --rm を毎回叩くと container の作成と破棄を
    # 繰り返すため、基本作業は起動済みの container へ exec する。
    command: ["sleep", "infinity"]

    # PID 1 で zombie を回収し、exec した shell の Ctrl-C を効かせる
    init: true
    stdin_open: true
    tty: true

    working_dir: /workspace

    volumes:
      # リポジトリ本体。.venv は UV_PROJECT_ENVIRONMENT で /opt/venv へ逃がしてある
      - ../:/workspace

      # 仮想環境と cache は named volume に置いて再 build 間で保つ
      - ml-venv:/opt/venv
      - ml-uv-cache:/home/${USER_NAME}/.cache/uv
      - ml-pre-commit-cache:/home/${USER_NAME}/.cache/pre-commit

      # torch.compile の生成コード cache。container を作り直すたびに全再 compile に
      # ならないよう、他の cache と同じく named volume へ置く
      - ml-inductor-cache:/home/${USER_NAME}/.cache/torchinductor
      - ml-triton-cache:/home/${USER_NAME}/.triton

volumes:
  ml-venv:
  ml-uv-cache:
  ml-pre-commit-cache:
  ml-inductor-cache:
  ml-triton-cache:
