name: python-validation

# default branch への push では常に走らせ、pull request では検証結果が
# 変わり得る path が触られたときだけ走らせる。
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.py"
      # UI frontend の配信資産。テンプレ / JS だけの変更でも E2E とページテストが
      # 失敗し得るため（*.py だけでは pytest も pyright も走らない）
      - "src/web/ui/templates/**"
      - "src/web/ui/static/**"
      # テストの入力と golden（tests/data、tests/golden）、同梱資産とシミュレーション起動の設定（data/）、
      # 実際に起動する運用スクリプト
      - "tests/**"
      - "data/**"
      - "scripts/**"
      - install.sh
      - "deploy/**"
      - Makefile
      - github-runner/setup.sh
      - pyproject.toml
      - uv.lock
      - .github/workflows/python-validation.yml

concurrency:
  group: python-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pyright:
    runs-on: [self-hosted, linux, ARM64, rpi-ci]
    timeout-minutes: 15
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Configure host caches
        run: echo "UV_CACHE_DIR=$HOME/.cache/uv" >>"$GITHUB_ENV"

      - name: Sync dependencies
        run: |
          uv venv --clear --system-site-packages --python /usr/bin/python3
          uv sync --locked --all-groups

      - name: Run pyright
        run: make type

  # 非 E2E テストと WebUI E2E は互いに独立なので、別 job にして別の runner で並列に走らせる。
  pytest:
    runs-on: [self-hosted, linux, ARM64, rpi-ci]
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Configure host caches
        run: echo "UV_CACHE_DIR=$HOME/.cache/uv" >>"$GITHUB_ENV"

      - name: Sync dependencies
        run: |
          uv venv --clear --system-site-packages --python /usr/bin/python3
          uv sync --locked --all-groups

      - name: Fetch LFS objects
        run: git lfs pull

      - name: Run tests
        run: make test
        env:
          PYTEST_ADDOPTS: --timeout=180 --junitxml=pytest-report.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 7

  e2e:
    runs-on: [self-hosted, linux, ARM64, rpi-ci]
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Configure host caches
        run: echo "UV_CACHE_DIR=$HOME/.cache/uv" >>"$GITHUB_ENV"

      - name: Sync dependencies
        run: |
          uv venv --clear --system-site-packages --python /usr/bin/python3
          uv sync --locked --all-groups

      - name: Fetch LFS objects
        run: git lfs pull

      - name: Prepare Chromium for browser tests
        run: |
          if [ ! -x /usr/bin/chromium ]; then
            uv run --no-sync playwright install --only-shell chromium
          fi

      - name: Run WebUI E2E tests
        run: make test-e2e
        env:
          PYTEST_ADDOPTS: --junitxml=e2e-report.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report.xml
          retention-days: 7
