name: pre-commit

# GitLab CI の workflow rules 相当。default branch への push と
# pull request で走らせ、MR 中の branch push で二重に走らせない。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: [self-hosted, linux, ARM64, rpi-ci]
    # ci/Containerfile を変えた後の最初の job は、その runner で image を build する時間を含む
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # 各コマンドは ci/run.sh が使い捨ての container で動かす（github-runner/README.md）
      - name: Sync dev dependencies
        run: |
          ci/run.sh uv venv --clear --python /usr/bin/python3
          ci/run.sh uv sync --locked --only-group dev --no-install-project

      - name: Run pre-commit
        run: ci/run.sh uv run --no-sync pre-commit run --all-files --show-diff-on-failure
