# paste_dispenserなしの設定（pnpマシン用）

[klipper]

[camera]
width = 640
height = 480
fps = 30.0
calibration_file = "calibration.json"

[camera.crop]
width = 400
height = 400

[reference_point]
x = 20.0
y = 10.0
target_diameter = 3.0
corner = "top_left" # アンカーコーナー: top_left / top_right / bottom_left / bottom_right
offset = [0.0, 0.0] # 基板コーナー → マーカー のオフセット [x, y] (mm)
