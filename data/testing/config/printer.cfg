# =============================================================================
# test-fixture: pytest / E2E 検証専用のフィクスチャ printer.cfg
# kurousagi から [printer] / [stepper_*] / [manual_stepper paste_dispenser] を抜粋
# コメントはモーション設定保存時のコメント保持テストの素材
# =============================================================================

[printer]
kinematics: inversed_corexy
max_velocity: 50
max_accel: 500
max_z_velocity: 3.0
max_z_accel: 15

# =============================================================================
# X軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio4
position_endstop: 0
position_min: 0
position_max: 60
homing_speed: 20
homing_retract_dist: 5

# =============================================================================
# Y軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio3
position_endstop: 0
position_min: 0
position_max: 60
homing_speed: 20
homing_retract_dist: 5

# =============================================================================
# Z軸 - 台形ネジ (ピッチ 1.5mm) + GT2 32T:32T (1:1) タイミングベルト
# =============================================================================
[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 64
rotation_distance: 1.5
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_min: -35
position_max: 0
homing_speed: 3            # Z軸は低速推奨
homing_retract_dist: 0      # センサーレスホーミングは2回タッチ不可
homing_positive_dir: true

# =============================================================================
# ペーストディスペンサー
# =============================================================================
[manual_stepper paste_dispenser]
step_pin: gpio14
dir_pin: gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 1
velocity: 1
accel: 10
