machine_type = "paste" # マシン種別: paste / pnp

[klipper]
host = "localhost"
port = 7125

[paste_dispenser]
# rotations_per_ul = 1.0 # 1μLあたりの回転数 [rev/μL]
rotations_per_ul = 8.0 # キャリブレーション値 2026/06/08 23G S3X70-E150DN
# rotations_per_ul = 31.491713 # キャリブレーション値 2026/06/05 S3X70-E150DN
# rotations_per_ul = 69.724771 # キャリブレーション値 2026/05/08 S3X70-E150DN
solder_paste_density = 3.78 # はんだペースト密度 [mg/uL] (S3X70-E150DN)
nozzle_diameter = 0.30 # ノズル内径 [mm] (23G)
dispense_mode = "auto" # 塗布方式: auto / dot / line / area
air_pump_enabled = true # エアポンプの有効/無効
auto_line_aspect_ratio = 1.618 # Auto時に線塗布へ切り替える縦横比
auto_area_short_side_factor = 4.0 # Auto時に面塗布へ切り替える短辺のノズル径倍率
max_dispense_rate = 0.2 # 吐出レート上限 [uL/sec]
max_fill_speed = 2.0 # 連続塗布できる移動速度上限 [mm/sec]（実機で 1812 が連続になるまで調整）
dispense_accel = 10.0 # 吐出加速度 [uL/sec^2]
retract_amount = 0.04 # リトラクション量 [uL]
retract_accel_factor = 2.0 # リトラクション加速度係数
paste_height = 0.2 # 塗布面のZ高さ [mm]、または auto
lift_height = 2.0 # 吐出後の上昇高さ [mm]
ul_per_mm2 = 0.2 # パッド面積あたりのペースト量 [uL/mm^2]
prime_extra_delay = 0.0 # プライム後の追加遅延 [sec]
initial_purge_ul = 0.3 # fill sequence前の初回パージ量 [uL]
overlap = 0.0

[paste_dispenser.toolhead]
# カメラに対するツールヘッドの相対位置 (mm)

# 設計値
# x = 0
# y = 26.46

# 実測値
x = -2.9405
y = 22.9727

[paste_dispenser.pad_align]
# 領域単位の銅箔照合 → 区ごとの局所補正（pad は最近傍の成功区の変位をそのまま使う）
# 実銅箔は設計から局所的にずれる（実測: 3.3mm 離れた隣接区で 0.36mm 違う）ため、
# 平均や大域アフィンで均さず、pad が属する区の変位をそのまま当てる
max_correction = 0.3   # 1 領域で許容する累積ずれ [mm]。超過は誤マッチとして照合失敗
search_window = 1.4    # 照合の探索窓 片側幅 [mm]
region_size_px = 100   # 照合領域の一辺 [px]（100 + 2*42 = 184 でフレームに収まる。
                       # 実測で 100 が最良・200 まで実用。広いと chamfer が局所変動を平均して鈍る）
min_regions = 4        # 成功が必要な最小領域数。下回ると塗布ジョブを中止
                       # （遠方の区の変位を全 pad へ当てるのを防ぐ絶対最小値）
max_passes = 5         # 1 領域あたりの再計測回数の上限（累積で投影を補正して再照合。実測で 5 回ほどで収束）
converge_tolerance = 0.005 # パス増分がこれ以下で収束とみなす [mm]（下限は指令位置の量子化 ≈2.5um）
board_edge_margin = 2.0 # 照合ROIが基板外形から確保する最小距離 [mm]（外周は削れやすく外形線が偽エッジになる）
min_sharpness = 0.15   # 拘束不足の棄却閾値（合成実測: 一方向のみ <= 0.06 / 良好 >= 0.5）
canny_low = 55.0       # Cannyエッジ検出の下側閾値
canny_high = 104.0     # Cannyエッジ検出の上側閾値
blur_ksize = 3         # GaussianBlurカーネルサイズ (奇数)

[camera]
device_id = 0
width = 1280
height = 720
fps = 30.0
format = "YUYV"
# キャリブレーション結果は機体固有なのでテンプレートには含めない。
# WebUI の camera_calibration ジョブを実行し、Apply でこのキーごと更新する
calibration_file = "calibration.json"

[camera.crop]
width = 300
height = 300

[probe]
min_radius = 0.3            # サンプル点が銅箔境界から確保すべき最小距離 [mm]
board_edge_margin = 2.0     # サンプル点が基板外形から確保すべき最小距離 [mm]
min_samples = 6             # 最小サンプル数 (2次曲面フィットに必要)
max_samples = 12            # 最大サンプル数
lift_height = 0.5

[reference_point]
# 基準点（top left）のおおよその絶対位置 (mm)
x = 12.0
y = 3.8
# 基準点の直径 (mm)
target_diameter = 3.0

# 基盤からみた基準点の相対位置 (mm)
[reference_point.offsets] # [x, y]で記述
top_left = [2.5, -5.0]
top_right = [-2.5, -5.0]
bottom_left = [2.5, 5.0]
bottom_right = [-2.5, 5.0]

[nozzle_cap]
x = 67.3
y = 52.0
z = -24.0
