# =============================================================================
# はんだペーストディスペンサーマシンの設定
# BTT SKR Pico - CoreXY (X/Y/Z) + Paste Dispenser
# リミットスイッチホーミング (X/Y)、センサーレスホーミング (Z)
# =============================================================================

# Klipper は repo 実パスで起動するため include は絶対パスで指定する
# (~/printer_data/config/mainsail.cfg -> /home/gop/mainsail-config/mainsail.cfg)
[include /home/gop/printer_data/config/mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504450593046881C-if00

[printer]
kinematics: inversed_corexy
max_velocity: 50
max_accel: 250
max_z_velocity: 3.0
max_z_accel: 15

# =============================================================================
# X軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio4
position_endstop: 0
position_min: 0
position_max: 70
homing_speed: 20
homing_retract_dist: 5

# =============================================================================
# Y軸 - GT2 16T プーリー (16 × 2mm = 32mm/rev)
# =============================================================================
[stepper_y]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 64
rotation_distance: 32
endstop_pin: ^gpio3
position_endstop: 0
position_min: 0
position_max: 60
homing_speed: 20
homing_retract_dist: 5

# =============================================================================
# Z軸 - 台形ネジ (ピッチ 1.5mm) + GT2 32T:32T (1:1) タイミングベルト
# 1 モーター回転 = 1 ネジ回転 = 1.5mm
# センサーレスホーミング (TMC2209 StallGuard4)
# =============================================================================
[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 64
rotation_distance: 1.5
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_endstop: 0
position_min: -25
position_max: 0
homing_speed: 3            # Z軸は低速推奨
homing_retract_dist: 0      # センサーレスホーミングは2回タッチ不可
homing_positive_dir: true

# =============================================================================
# ペーストディスペンサー
# =============================================================================
[manual_stepper paste_dispenser]
step_pin: gpio14
dir_pin: gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 1
velocity: 1
accel: 10

# =============================================================================
# TMC2209 ドライバー設定
# =============================================================================
[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.40
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.40
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.4
stealthchop_threshold: 999999
diag_pin: ^gpio25           # 旧 Z-STOP (gpio25) に DIAG を配線
driver_SGTHRS: 40          # StallGuard 感度しきい値 (実機で要調整)

[tmc2209 manual_stepper paste_dispenser]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.6

[virtual_sdcard]
path: /home/gop/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[force_move]
enable_force_move: True

# =============================================================================
# ホーミング順序 (Z → X → Y)
# Z=0 がトップ位置のため、先に Z を上げてから XY を動かすことでノズルの
# 引っかかりを防ぐ
# =============================================================================
[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    {% if home_all or 'Z' in params %}
        G28 Z
    {% endif %}

    {% if home_all or 'X' in params %}
        G28 X
    {% endif %}

    {% if home_all or 'Y' in params %}
        G28 Y
    {% endif %}

[gcode_macro PRESENT]
description: X,Z軸を原点に戻し、Y軸の台座を動かして基盤を差し出す。その後脱力して待機
gcode:
    {% set y_max = printer.configfile.settings.stepper_y.position_max - 10 %} # 10mm余裕を持たせる
    G90
    G1 X0 Y{y_max} Z0 F1200
    M18

# トップライトのピン
[output_pin led_light]
pin: gpio17         # FAN1
value: 1             # 起動時ON
shutdown_value: 1    # シャットダウン時もON

# エアポンプ
[output_pin air_pump]
pin: gpio21          # HB
value: 0             # 起動時ON

# =============================================================================
# ロードセル式プローブ
# =============================================================================
[load_cell_probe]
sensor_type: hx711
sclk_pin: gpio0
dout_pin: gpio1
sample_rate: 80
# 較正値: 2026-07-02 の LOAD_CELL_CALIBRATE 結果
counts_per_gram: 3131.77647
reference_tare_counts: -106647
trigger_force: 10
speed: 2
lift_speed: 20
samples: 1
sample_retract_dist: 0.5
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3
z_offset: 0
