machine_type = "paste" # マシン種別: paste / pnp

[klipper]
host = "localhost"
port = 7125

[paste_dispenser]
# rotations_per_ul = 1.0 # 1μLあたりの回転数 [rev/μL]
rotations_per_ul = 10.650118 # キャリブレーション値 2026/06/08 23G S3X70-E150DN
# rotations_per_ul = 31.491713 # キャリブレーション値 2026/06/05 S3X70-E150DN
# rotations_per_ul = 69.724771 # キャリブレーション値 2026/05/08 S3X70-E150DN
solder_paste_density = 3.78 # はんだペースト密度 [mg/uL] (S3X70-E150DN)
nozzle_diameter = 0.30 # ノズル内径 [mm] (23G)
dispense_mode = "auto" # 塗布方式: auto / dot / line / area
line_direction = "unconstrained" # 線の走行方向: unconstrained / outward / inward
air_pump_enabled = true # エアポンプの有効/無効
auto_line_aspect_ratio = 1.618 # Auto時に線塗布へ切り替える縦横比
auto_area_short_side_factor = 4.0 # Auto時に面塗布へ切り替える短辺のノズル径倍率
max_dispense_rate = 0.05 # 吐出レート上限 [uL/sec]
max_fill_speed = 2.0 # 連続塗布できる移動速度上限 [mm/sec]（実機で 1812 が連続になるまで調整）
dispense_accel = 0.354839 # 吐出加速度 [uL/sec^2]
retract_amount = 0.03 # リトラクション量 [uL]
retract_accel_factor = 5.0 # リトラクション加速度係数
paste_height = 0.2 # 塗布面のZ高さ [mm]、または auto
lift_height = 1.0 # 吐出後の上昇高さ [mm]
ul_per_mm2 = 0.2 # パッド面積あたりのペースト量 [uL/mm^2]
prime_extra_delay = 0.0 # プライム後の追加遅延 [sec]
initial_purge_ul = 0.2 # fill sequence前の初回パージ量 [uL]
overlap = 0.0
retract_rate = 0.1

[paste_dispenser.toolhead]
# カメラに対するツールヘッドの相対位置 (mm)

# 設計値
# x = 0
# y = 24.08

# 実測値
# x = 1.9873
x = 1.8873
y = 22.6961

[paste_dispenser.pad_align]
# pad単位の銅箔照合による位置合わせ
tolerance = 0.05     # 収束許容誤差 [mm]。並進は整数pxで最小残差は斜め1px = √2/30.225 = 0.0468mm。これを超える値にする
max_correction = 0.5         # 1回の照合で許容する最大ずれ [mm]。超過は誤マッチとして照合失敗
search_window = 1.0 # 照合の探索窓 片側幅 [mm]
roi_margin = 0.5    # pad ROIのマージン [mm]
min_roi = 1.0       # pad ROIの最小辺長 [mm]
canny_low = 104.0   # Cannyエッジ検出の下側閾値
canny_high = 235.0  # Cannyエッジ検出の上側閾値
blur_ksize = 1      # GaussianBlurカーネルサイズ (奇数)
region_size_px = 200
region_count = 8
min_regions = 5
max_passes = 5
board_edge_margin = 1.0
converge_tolerance = 0.015
region_overlap = 0.2

[camera]
device_id = 0
width = 1280
height = 800
fps = 30.0
format = "YUYV"
# キャリブレーション結果は機体固有なのでテンプレートには含めない。
# WebUI の camera_calibration ジョブを実行し、Apply でこのキーごと更新する
calibration_file = "calibration.json"

[camera.crop]
width = 600
height = 600

[xy_calibration]
max_standard_deviation = 0.05

[probe]
min_radius = 0.3            # サンプル点が銅箔境界から確保すべき最小距離 [mm]
board_edge_margin = 2.0     # サンプル点が基板外形から確保すべき最小距離 [mm]
min_samples = 6             # 最小サンプル数 (2次曲面フィットに必要)
max_samples = 12            # 最大サンプル数
lift_height = 0.5

[reference_point]
# 基準点（top left）のおおよその絶対位置 (mm)
x = 8.5
y = 5.7
# 基準点の直径 (mm)
target_diameter = 3.0

# 基盤からみた基準点の相対位置 (mm)
[reference_point.offsets] # [x, y]で記述
top_left = [2.5, -5.0]
top_right = [-2.5, -5.0]
bottom_left = [2.5, 5.0]
bottom_right = [-2.5, 5.0]

[nozzle_cap]
x = 68.0
y = 53.0
z = -38.0

# ジョブ完了通知音の出力先。省略時は ALSA のシステム既定デバイス・音量 0.75。
# WebUI の /dev/audio で選ぶと config/machine.toml 側に書き込まれる
# [audio]
# device = "default" # aplay -L の PCM 名（例 plughw:CARD=sndrpihifiberry,DEV=0）
# volume = 0.75      # 0.0〜1.0

[audio]
device = "plughw:CARD=MAX98357A,DEV=0"
volume = 0.3
