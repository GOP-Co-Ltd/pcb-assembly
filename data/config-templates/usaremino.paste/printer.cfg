[include mainsail.cfg]
[mcu]
# setup-machine-config.sh が /dev/serial/by-id の実デバイスに書き換える
serial: /dev/serial/by-id/<your-mcu-id>

[virtual_sdcard]
path: /home/gop/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# =============================================================================
# test-fixture: pytest / E2E 検証専用のフィクスチャ printer.cfg
# BTT SKR Pico - Cartesian (X/Y/Z) + Paste Dispenser
# コメントはモーション設定保存時のコメント保持テストの素材
# =============================================================================

[printer]
kinematics: cartesian
max_velocity: 10
max_accel: 50
max_z_velocity: 5
max_z_accel: 10

# =============================================================================
# X軸 - ピッチ 1.5mm 台形ネジ、ダイレクトドライブ (1.5mm/rev)
# センサーレスホーミング (TMC2209 StallGuard4)
# =============================================================================
[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 64
rotation_distance: 1.5
endstop_pin: ^gpio4
position_endstop: 0
position_min: 0
position_max: 70
homing_speed: 10
homing_retract_dist: 1

# =============================================================================
# Y軸 - ピッチ 1.5mm 台形ネジ、ダイレクトドライブ (1.5mm/rev)
# センサーレスホーミング (TMC2209 StallGuard4)
# =============================================================================
[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 64
rotation_distance: 1.5
endstop_pin: ^gpio3
position_endstop: 0
position_min: 0
position_max: 70
homing_speed: 10
homing_retract_dist: 1

# =============================================================================
# Z軸 - ピッチ 1.5mm 台形ネジ、ダイレクトドライブ (1.5mm/rev)
# 正方向へ移動し、Z=0 のリミットスイッチでホーミング
# =============================================================================
[stepper_z]
step_pin: gpio19
dir_pin: !gpio28
enable_pin: !gpio2
microsteps: 64
rotation_distance: 1.5
endstop_pin: ^gpio25
position_endstop: 0
position_min: -45
position_max: 0
homing_speed: 10
homing_retract_dist: 1
homing_positive_dir: true

# =============================================================================
# ペーストディスペンサー
# =============================================================================
[manual_stepper paste_dispenser]
step_pin: gpio14
dir_pin: gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 1
velocity: 1
accel: 10

# =============================================================================
# TMC2209 ドライバー設定
# =============================================================================
[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.54
stealthchop_threshold: 999999
diag_pin: ^gpio4

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.54
stealthchop_threshold: 999999
diag_pin: ^gpio3

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.54
stealthchop_threshold: 999999

[tmc2209 manual_stepper paste_dispenser]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.54

# =============================================================================
# ホーミング順序 (Z → X → Y)
# 各軸のホーミング直後に座標0へ移動し、微小な位置ずれを解消する
# =============================================================================
[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    G90

    {% if home_all or 'Z' in params %}
        G28 Z
        G1 Z0
    {% endif %}

    {% if home_all or 'X' in params %}
        G28 X
        G1 X0
    {% endif %}

    {% if home_all or 'Y' in params %}
        G28 Y
        G1 Y0
    {% endif %}


[gcode_macro PRESENT]
description: X,Z軸を原点に戻し、Y軸の台座を動かして基盤を差し出す。その後脱力して待機
gcode:
    {% set y_max = printer.configfile.settings.stepper_y.position_max - 10 %} # 10mm余裕を持たせる
    G90
    G1 X0 Y{y_max} Z0 F1200
    M18


# トップライトのピン
[output_pin led_light]
pin: gpio17         # FAN1
value: 1             # 起動時ON
shutdown_value: 1    # シャットダウン時もON

# エアポンプ
[output_pin air_pump]
pin: gpio21          # HB
value: 0             # 起動時ON


# =============================================================================
# ロードセル式プローブ
# =============================================================================

[load_cell_probe]
sensor_type: hx711
sclk_pin: gpio0
dout_pin: gpio1
sample_rate: 80
# 較正値: 2026-08-26 の LOAD_CELL_CALIBRATE 結果
#counts_per_gram: 3036.147541
#reference_tare_counts: 12285
trigger_force: 10
speed: 2
lift_speed: 20
samples: 1
sample_retract_dist: 0.5
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3
z_offset: 0

